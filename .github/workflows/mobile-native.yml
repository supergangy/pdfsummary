name: 앱 네이티브 빌드

# 기기 안 AI 모듈(mobile/modules/device-ai)처럼 네이티브 코드가 들어간 앱을
# 실제 Android·iOS 빌드 도구로 빌드해 본다.
# 안드로이드는 갤럭시탭 등에 바로 설치할 수 있는 APK를 만들어 이 실행의 'Artifacts'에 올린다.
#   - 앱 코드(JS)가 APK 안에 들어 있어 컴퓨터 없이 실행됨
#   - 서명: 프로젝트 템플릿에 들어 있는 고정 키(android/app/debug.keystore) → 빌드마다 서명이 같아
#     새 APK를 덮어 설치할 수 있다 (기기 안 노트 유지). 플레이 스토어에 올릴 때는 자기 키로 바꿔야 함.
on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-native.yml"
  workflow_dispatch:

concurrency:
  group: mobile-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: 네이티브 프로젝트 만들기
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          npx expo prebuild --platform android --no-install
          grep -n "versionCode" android/app/build.gradle
      - name: 빌드 (설치용 APK, 64비트·32비트 ARM 태블릿·폰)
        working-directory: mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: APK 이름 붙이기
        run: |
          mkdir -p ../apk-out
          cp android/app/build/outputs/apk/release/*.apk "../apk-out/pdfsummary-${{ github.run_number }}.apk"
      - name: APK 올리기 (이 실행 화면의 Artifacts에서 받기)
        uses: actions/upload-artifact@v4
        with:
          name: pdfsummary-android-${{ github.run_number }}
          path: apk-out/*.apk
          retention-days: 30
          if-no-files-found: error
      - name: 우리 네이티브 모듈이 들어갔는지 (기기 안 AI, PDF 쪽, 손글씨 인식, Google 로그인)
        run: |
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          unzip -l "$apk" | grep -q "classes" && echo "APK: $apk"
          grep -rn "minSdk" android/gradle.properties android/build.gradle android/app/build.gradle || true
          for m in deviceai/DeviceAiModule pdfpages/PdfPagesModule pdfpages/PageText inkrecognizer/InkRecognizerModule; do
            unzip -p "$apk" 'classes*.dex' | grep -a -q "expo/modules/$m" && echo "있음: $m" || {
              echo "APK에 없음: $m"; unzip -l "$apk" | grep dex
              unzip -p "$apk" 'classes*.dex' | grep -a -o "expo/modules/[a-z]*/[A-Za-z]*Module" | sort -u | head -40
              unzip -p "$apk" 'classes*.dex' | grep -a -o "[A-Za-z/]*DeviceAi[A-Za-z]*" | sort -u | head; exit 1; }
          done
          unzip -p "$apk" 'classes*.dex' | grep -a -q "com/reactnativegooglesignin/RNGoogleSigninModule" && echo "있음: Google 로그인" || (echo "APK에 없음: Google 로그인"; exit 1)
          # 앱 코드(JS)가 APK 안에 들어 있어야 컴퓨터 없이 실행된다
          unzip -l "$apk" | grep -q "assets/index.android.bundle" && echo "있음: 앱 코드(JS)" || (echo "APK에 앱 코드가 없음"; exit 1)
          ls -la "$apk"

  ios:
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Xcode 26 (FoundationModels SDK) 고르기
        run: |
          x=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$x" ] && sudo xcode-select -s "$x"
          xcodebuild -version
          # FoundationModels가 없는 SDK면 모듈의 '#if canImport' 안쪽이 컴파일되지 않아 확인이 안 된다
          echo 'import FoundationModels' > /tmp/fm.swift
          xcrun --sdk iphonesimulator swiftc -typecheck -target arm64-apple-ios26.0-simulator \
            -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" /tmp/fm.swift
      - run: npm ci
      - name: 네이티브 프로젝트 만들기 (CocoaPods 포함)
        # Google 로그인 설정 플러그인(URL scheme)까지 거치도록 시험용 iOS 클라이언트 ID로
        env:
          GOOGLE_IOS_CLIENT_ID: 000000000000-ci.apps.googleusercontent.com
        run: |
          npx expo prebuild --platform ios
          grep -l "com.googleusercontent.apps.000000000000-ci" ios/*/Info.plist || (echo "Info.plist에 Google 로그인 URL scheme이 없음"; exit 1)
      - name: 빌드 (시뮬레이터, 서명 없음)
        working-directory: mobile/ios
        run: |
          ws=$(ls -d *.xcworkspace | head -1)
          scheme=$(xcodebuild -workspace "$ws" -list -json | python3 -c "import json,sys; d=json.load(sys.stdin)['workspace']['schemes']; print(next(s for s in d if not s.startswith(('Pods','Expo','React','DeviceAi','RN','hermes','Yoga','fmt','glog','boost','DoubleConversion','SocketRocket'))))")
          echo "workspace=$ws scheme=$scheme"
          set -o pipefail
          xcodebuild -workspace "$ws" -scheme "$scheme" -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -40
      - name: 우리 네이티브 모듈이 컴파일됐는지 (기기 안 AI, PDF 쪽, 손글씨 인식, Google 로그인)
        run: |
          for m in DeviceAiModule PdfPagesModule InkRecognizerModule RNGoogleSignin; do
            find ~/Library/Developer/Xcode/DerivedData -name "$m*.o" | head -1 | grep . || (echo "컴파일되지 않음: $m"; exit 1)
          done
