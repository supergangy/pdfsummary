name: 점검

on:
  push:
  workflow_dispatch:

env:
  PYTHONIOENCODING: utf-8

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install . pytest
      - name: 한국어 글자 인식 모델 받기
        run: python -m pdfsummary.ocr --download --dest ocr_models
      - name: 테스트 (실제 글자 인식 포함)
        env:
          PDFSUMMARY_MODELS: ${{ github.workspace }}/ocr_models
        run: python -m pytest -q -rs

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: 파이썬 서버 설치 (앱 시험에 씀)
        working-directory: .
        run: python -m pip install .
      - run: npm ci
      - name: 타입 검사
        run: npx tsc --noEmit
      - name: 서버와 대화 시험
        run: npm test
      - name: iOS·Android 번들 만들어 보기
        run: |
          npx expo export --platform ios --output-dir /tmp/export-ios
          npx expo export --platform android --output-dir /tmp/export-android
      - name: 웹판 만들기 (필기 앱을 브라우저로 시험)
        run: npx expo export --platform web --output-dir dist-web
      - name: 브라우저로 필기 앱 시험 (쓰기·지우기·저장·내보내기·요약)
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          node e2e/notes.e2e.cjs dist-web

  ollama:
    # 내 컴퓨터 AI(Ollama) 연결을 진짜 Ollama + 아주 작은 모델로 확인 (요약 품질이 아니라 요청·답 형식 확인)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install . pytest
      - name: Ollama 설치·실행, 작은 모델 받기
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &) || true
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:11434/api/tags > /dev/null && break; sleep 1; done
          ollama --version
          ollama pull qwen2.5:0.5b
      - name: 실제 Ollama로 시험
        env:
          PDFSUMMARY_REAL_OLLAMA_MODEL: qwen2.5:0.5b
          PDFSUMMARY_OLLAMA_MAX_TOKENS: "4096"
        run: python -m pytest -q -rs -s -m real_ollama tests/test_local_ai.py

